<!doctype html>
<meta charset="utf-8">
<title>Dino</title>
<style>
  html, body { height: 100%; margin: 0; background: #111; overflow: hidden }
  iframe { display: block; width: 100%; height: 100%; border: 0 }
</style>
<!-- sys42 app wrapper (original code for xerohour/windows93): hosts the
     program in an isolated iframe inside a sys42 window, following the
     SkiFree/Doom pattern. The iframe keeps the program's globals, timers
     and audio loops out of the desktop, and closing the window tears the
     iframe down. Keyboard input goes to the program whenever the frame has
     focus: it is focused on load, and a click inside the window focuses it
     natively. The relative path climbs from sys42/42/os/apps/Dino/
     to the repo-root programs/ folder. -->
<iframe id="app" src="../../../../../programs/dino/index.html" title="Dino" allow="autoplay; gamepad; fullscreen" allowfullscreen></iframe>
<script>
  const frame = document.getElementById("app")
  frame.addEventListener("load", () => frame.focus())
</script>
