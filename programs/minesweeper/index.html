<!doctype html>
<meta charset="utf-8" />
<title>Minesweeper</title>
<style>
  body { font-family: Tahoma, Verdana, sans-serif; background: #c0c0c0; margin: 0; padding: 10px; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto 8px; }
  .lcd { background: #000; color: #f00; font-family: "Courier New", monospace; font-weight: bold; font-size: 20px; padding: 2px 6px; min-width: 52px; }
  #face { font-size: 22px; width: 44px; height: 40px; cursor: pointer; }
  #grid { display: grid; gap: 0; margin: 0 auto; width: fit-content; border: 3px inset #eee; }
  .cell { width: 26px; height: 26px; font-size: 15px; font-weight: bold; line-height: 26px; text-align: center;
          background: #c0c0c0; border: 2px outset #fff; box-sizing: border-box; cursor: pointer; user-select: none; }
  .cell.open { border: 1px solid #999; background: #d4d4d4; cursor: default; }
  .cell.boom { background: #f00; }
  .n1 { color: #00a } .n2 { color: #070 } .n3 { color: #d00 } .n4 { color: #007 } .n5 { color: #700 } .n6 { color: #077 } .n7 { color: #000 } .n8 { color: #777 }
  select { font-size: 13px; }
  .dim { color: #555; font-size: 11px; margin-top: 8px; }
</style>
<div class="bar">
  <div class="lcd" id="mines">010</div>
  <button id="face">🙂</button>
  <div class="lcd" id="time">000</div>
</div>
<div class="bar">
  <label>Difficulty
    <select id="diff">
      <option value="9,9,10">Beginner (9×9)</option>
      <option value="16,16,40" selected>Intermediate (16×16)</option>
      <option value="16,30,99">Expert (16×30)</option>
    </select>
  </label>
  <span class="dim">Left-click reveal · right-click flag</span>
</div>
<div id="grid"></div>
<p class="dim">Original implementation written for xerohour/windows93 — Windows93 had a “mines” app; this is a from-scratch recreation of the classic game, no code copied.</p>
<script>
  const gridEl = document.getElementById("grid")
  const minesEl = document.getElementById("mines")
  const timeEl = document.getElementById("time")
  const faceEl = document.getElementById("face")
  let R, C, M, board, open, flags, started, over, timer, seconds, flagsUsed

  function newGame() {
    ;[R, C, M] = document.getElementById("diff").value.split(",").map(Number)
    board = Array.from({ length: R }, () => Array(C).fill(0))
    open = Array.from({ length: R }, () => Array(C).fill(false))
    flags = Array.from({ length: R }, () => Array(C).fill(false))
    started = false; over = false; seconds = 0; flagsUsed = 0
    clearInterval(timer); timeEl.textContent = "000"
    minesEl.textContent = String(M).padStart(3, "0")
    faceEl.textContent = "🙂"
    gridEl.style.gridTemplateColumns = `repeat(${C}, 26px)`
    gridEl.innerHTML = ""
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      const d = document.createElement("div")
      d.className = "cell"; d.dataset.r = r; d.dataset.c = c
      d.oncontextmenu = (e) => { e.preventDefault(); toggleFlag(r, c) }
      d.onclick = () => reveal(r, c)
      gridEl.appendChild(d)
    }
  }
  function plant(safeR, safeC) {
    let placed = 0
    while (placed < M) {
      const r = Math.floor(Math.random() * R), c = Math.floor(Math.random() * C)
      if (board[r][c] === -1 || (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) continue
      board[r][c] = -1; placed++
    }
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      if (board[r][c] === -1) continue
      let n = 0
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc
        if (rr >= 0 && rr < R && cc >= 0 && cc < C && board[rr][cc] === -1) n++
      }
      board[r][c] = n
    }
  }
  function cellEl(r, c) { return gridEl.children[r * C + c] }
  function toggleFlag(r, c) {
    if (over || open[r][c]) return
    flags[r][c] = !flags[r][c]
    flagsUsed += flags[r][c] ? 1 : -1
    cellEl(r, c).textContent = flags[r][c] ? "🚩" : ""
    minesEl.textContent = String(Math.max(0, M - flagsUsed)).padStart(3, "0")
  }
  function reveal(r, c) {
    if (over || flags[r][c] || open[r][c]) return
    if (!started) {
      plant(r, c); started = true
      timer = setInterval(() => { seconds++; timeEl.textContent = String(Math.min(999, seconds)).padStart(3, "0") }, 1000)
    }
    if (board[r][c] === -1) { gameOver(r, c); return }
    const stack = [[r, c]]
    while (stack.length) {
      const [cr, cc] = stack.pop()
      if (open[cr][cc] || flags[cr][cc]) continue
      open[cr][cc] = true
      const el = cellEl(cr, cc); el.classList.add("open")
      if (board[cr][cc] > 0) { el.textContent = board[cr][cc]; el.classList.add("n" + board[cr][cc]) }
      else for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = cr + dr, cc2 = cc + dc
        if (rr >= 0 && rr < R && cc2 >= 0 && cc2 < C && !open[rr][cc2] && board[rr][cc2] !== -1) stack.push([rr, cc2])
      }
    }
    checkWin()
  }
  function checkWin() {
    let closed = 0
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) if (!open[r][c]) closed++
    if (closed === M) { over = true; clearInterval(timer); faceEl.textContent = "😎"; minesEl.textContent = "000" }
  }
  function gameOver(hr, hc) {
    over = true; clearInterval(timer); faceEl.textContent = "💀"
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      if (board[r][c] === -1) { const el = cellEl(r, c); el.textContent = "💣"; if (r === hr && c === hc) el.classList.add("boom") }
      else if (flags[r][c]) cellEl(r, c).textContent = "❌"
    }
  }
  faceEl.onclick = newGame
  document.getElementById("diff").onchange = newGame
  newGame()
</script>
